$kind: http-request
method: POST
url: http://127.0.0.1:5000/api/meseros
order: 2000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Juan Pérez",
      "usuario": "jperez",
      "contrasena": "segura123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is an array and has required fields", function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData).to.be.an('array');
          if (jsonData.length > 0) {
              pm.expect(jsonData[0]).to.have.property('id_mesero');
              pm.expect(jsonData[0]).to.have.property('nombre');
              pm.expect(jsonData[0]).to.have.property('usuario');
          }
      });

      pm.test("Response time is under 1000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });
