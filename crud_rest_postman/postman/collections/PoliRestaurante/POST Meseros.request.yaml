$kind: http-request
method: POST
url: http://127.0.0.1:5000/api/meseros
order: 2000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "María García",
      "usuario": "mgarcia",
      "contrasena": "clave456"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Response is the created mesero", function () {
          const jsonData = pm.response.json();
          pm.expect(jsonData).to.be.an('object');
          pm.expect(jsonData.id_mesero).to.be.a('number');
          pm.expect(jsonData).to.have.property('nombre');
          pm.expect(jsonData).to.have.property('usuario');
          pm.expect(jsonData).not.to.have.property('contrasena');
          pm.collectionVariables.set('id_mesero', jsonData.id_mesero);
      });

      pm.test("Response time is under 1000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(1000);
      });
