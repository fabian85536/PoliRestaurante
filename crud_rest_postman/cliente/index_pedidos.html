<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Formulario para crear pedidos con sus productos en PoliRestaurante."
    />
    <title>PoliRestaurante | Crear pedido</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="js/pedido.js"></script>
  </head>
  <body>
    <header class="py-4 mb-4 shadow-sm">
      <div class="container">
        <p class="eyebrow mb-1">Panel local de administración</p>
        <h1 class="h2 mb-1">PoliRestaurante</h1>
        <p class="mb-0 text-white-50">Registro de pedidos</p>
      </div>
    </header>

    <main class="container pb-5">
      <p>
        <a href="index.html" class="link-primary">Volver a Administración</a>
      </p>

      <div id="mensaje" class="alert d-none" role="status" aria-live="polite"></div>

      <section class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h2 class="h4 mb-1">Crear pedido con productos</h2>
          <p class="text-secondary">
            Guarda el pedido y todos sus productos como una sola operación.
          </p>
          <form id="formulario-pedido">
            <div class="row g-3 mb-4">
              <div class="col-12 col-md-6">
                <label for="pedido-tipo" class="form-label">Tipo de pedido</label>
                <input id="pedido-tipo" name="tipo_pedido" class="form-control" />
              </div>
              <div class="col-12 col-md-6">
                <label for="pedido-cliente" class="form-label">Nombre del cliente</label>
                <input id="pedido-cliente" name="nombre_cliente" class="form-control" />
              </div>
              <div class="col-12 col-md-6">
                <label for="pedido-estado" class="form-label">Estado</label>
                <input id="pedido-estado" name="estado" class="form-control" />
              </div>
              <div class="col-12 col-md-6">
                <label for="pedido-total" class="form-label">Total</label>
                <input
                  id="pedido-total"
                  name="total"
                  type="number"
                  min="0"
                  step="1"
                  class="form-control"
                  readonly
                />
              </div>
            </div>

            <p
              id="mensaje-productos"
              class="small text-secondary"
              role="status"
              aria-live="polite"
            ></p>
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h3 class="h5 mb-0">Productos del pedido</h3>
              <button
                id="btn-agregar-producto"
                type="button"
                class="btn btn-outline-primary btn-sm"
              >
                Agregar producto
              </button>
            </div>
            <div id="filas-productos" class="vstack gap-3"></div>
            <button id="btn-crear-pedido" type="submit" class="btn btn-primary mt-4">
              Crear pedido con productos
            </button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
